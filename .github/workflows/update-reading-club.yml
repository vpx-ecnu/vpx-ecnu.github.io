name: Update VPX Reading Club (data + covers)

on:
  schedule:
    # 每天 02:30 UTC 运行（中国/沙特是 +8/+3，对应上午/清晨）
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: update-reading-club
  # Never cancel after a content push but before the deploy dispatch.
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史不一定，但设为 0 更稳
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run update script
        run: |
          set -e
          backup_dir="/tmp/reading_club_backup"
          rm -rf "${backup_dir}"
          mkdir -p "${backup_dir}"

          if [ -f src/data/readingClub.json ]; then
            cp src/data/readingClub.json "${backup_dir}/readingClub.json.bak"
          fi
          if [ -d public/reading_club_covers ]; then
            cp -a public/reading_club_covers "${backup_dir}/reading_club_covers.bak"
          fi

          if python scripts/update_reading_club.py; then
            echo "Reading club update succeeded."
          else
            echo "Reading club update failed, restoring backups."
            if [ -f "${backup_dir}/readingClub.json.bak" ]; then
              cp "${backup_dir}/readingClub.json.bak" src/data/readingClub.json
            fi
            if [ -d "${backup_dir}/reading_club_covers.bak" ]; then
              rm -rf public/reading_club_covers
              cp -a "${backup_dir}/reading_club_covers.bak" public/reading_club_covers
            fi
            exit 1
          fi

      - name: Commit changes (if any)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add src/data/readingClub.json public/reading_club_covers

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            git commit -m "chore: update reading club data & covers"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: ${{ steps.commit.outputs.changed == 'true' }}
        run: git push

      - name: Trigger Pages deployment
        # Manual runs double as a recovery path when a previous dispatch failed.
        if: ${{ steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
