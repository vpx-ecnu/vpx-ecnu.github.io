name: Update Publications

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml pillow
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Update publications
        run: |
          set -e
          backup_dir="/tmp/publications_backup"
          rm -rf "${backup_dir}"

          if [ -d public/publications ]; then
            cp -a public/publications "${backup_dir}"
          fi

          if \
            python src/backend/build_publication_updated.py && \
            python src/backend/update_project_publications_cards.py && \
            python src/backend/update_recent_publications_cards.py && \
            python src/backend/generate_derived_media.py; then
            echo "Publications update succeeded."
          else
            echo "Publications update failed, restoring backups."
            if [ -d "${backup_dir}" ]; then
              rm -rf public/publications
              cp -a "${backup_dir}" public/publications
            fi
            echo "::error::Publication update failed. Restored the previous public/publications snapshot."
            {
              echo "## Publications Update Failed"
              echo
              echo "The workflow restored the previous \`public/publications\` backup, so the website data was left unchanged."
              echo
              echo "Please inspect the failing script logs in this run."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/publications
          git commit -m "chore: update publications" || echo "No changes"
          git push
