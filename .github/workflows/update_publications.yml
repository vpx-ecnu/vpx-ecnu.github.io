name: Update Publications

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml

      - name: Update publications
        run: |
          python src/backend/update_publications_from_ihpdep.py
          python src/backend/update_recent_publications_cards.py
          python src/backend/update_project_publications_cards.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/publications/publication_updated.json
          git add public/publications/recent_publications.json
          git add public/publications/project_publications.json
          git add public/publications/recent_images || true
          git commit -m "chore: update publications" || echo "No changes"
          git push
