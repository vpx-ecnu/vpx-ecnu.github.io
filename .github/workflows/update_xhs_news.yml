name: Update XHS news.json

on:
  workflow_dispatch:
  schedule:
    # 每天 03:15 UTC（北京时间 11:15）
    - cron: "15 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-xhs-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps (Spider_XHS)
        run: |
          python -m pip install --upgrade pip
          pip install -r Spider_XHS/requirements.txt
          pip install pandas openpyxl

      - name: Write Spider_XHS/.env from Secret
        run: |
          echo "${{ secrets.SPIDER_XHS_ENV }}" > Spider_XHS/.env
          # 可选：避免换行符/回车问题（Windows CRLF）
          sed -i 's/\r$//' Spider_XHS/.env

      - name: Run pipeline
        run: |
          python run_xhs_pipeline.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/news.json public/xhs_news_images || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update XHS news + images"
          git push
