name: Update XHS news.json

on:
  workflow_dispatch:
  schedule:
    # 每天 03:15 UTC（北京时间 11:15）
    - cron: "15 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-xhs-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps (MediaCrawler)
        run: |
          python -m pip install --upgrade pip
          pip install -r MediaCrawler/requirements.txt
          pip install pandas openpyxl
          python -m playwright install chromium

      - name: Run pipeline
        env:
          XHS_CREATOR_ID: ${{ secrets.XHS_CREATOR_ID }}
          XHS_COOKIES: ${{ secrets.XHS_COOKIES }}
        run: |
          set -e
          backup_file="/tmp/news.json.bak"

          if [ -f public/news.json ]; then
            cp public/news.json "${backup_file}"
          fi

          if python run_xhs_pipeline_mediacrawler.py; then
            echo "Pipeline succeeded."
          else
            echo "Pipeline failed, restore original news.json."
            if [ -f "${backup_file}" ]; then
              cp "${backup_file}" public/news.json
            fi
            exit 0
          fi

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/news.json public/xhs_news_images public/xhs_news_videos || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update XHS news + images"
          git push
